name: publish

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this installer matrix is being built
        required: false
        default: manual dispatch
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (lockfile + schema)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: refuse bun.lock (tauri-action lockfile detect)
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            echo "::error::bun.lock present — tauri-action will run bun, not npm. One lockfile = one truth."
            exit 1
          fi

      - name: install frontend dependencies
        run: npm ci

      - name: environment doctor + release preflight
        run: |
          npm run doctor
          npm run release:prepare

  build:
    needs: preflight
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            os_name: linux
            args: ''
          - platform: windows-latest
            os_name: windows
            args: ''
          - platform: macos-latest
            os_name: macos (ARM)
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            os_name: macos (Intel)
            args: --target x86_64-apple-darwin

    name: Building for ${{ matrix.os_name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libusb-1.0-0-dev

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # npm world == the world the app is verified green in (package-lock.json).
      # Deliberately NOT bun: bun.lock resolves different dep versions, which is
      # how the 4-runner TS2345 failure happened. One lockfile = one truth.
      # tauriScript below is belt-and-suspenders in case a bun.lock sneaks back.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: |
            See the assets to download this version and install.

            Built because: ${{ github.event.inputs.reason || github.ref }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: upload unsigned artifacts (backup if the Release step is skipped)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droidkit-${{ matrix.os_name }}
          path: |
            src-tauri/target/release/bundle
            src-tauri/target/*/release/bundle
          if-no-files-found: ignore
          retention-days: 14
