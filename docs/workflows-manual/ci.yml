name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Fast, cheap gates that turn every push/PR green-or-red in minutes,
# BEFORE the heavyweight publish matrix ever runs. This is the
# "installs-from-git-without-friction" guarantee: nothing unbuildable
# reaches main unnoticed.

jobs:
  frontend-gates:
    name: Frontend gates (typecheck, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: install frontend dependencies (frozen lockfile = one truth)
        run: npm ci

      - name: typecheck
        run: npm run lint

      - name: production build
        run: npm run build

      - name: verified engines + lab gate (111+ checks)
        run: npm run test:lab && npm run test:nck && npm run test:rescue

      - name: production audit
        run: npm run audit:prod

  rust-compile-check:
    name: Rust compile check (${{ matrix.os }}) — the historical blind spot
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: install system libs (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libusb-1.0-0-dev

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: frontend deps (cargo generate_context needs dist/, so build it)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: build frontend (dist/ feeds tauri generate_context!)
        run: npm ci && npm run build

      - name: cargo check src-tauri
        working-directory: src-tauri
        run: cargo check --locked
