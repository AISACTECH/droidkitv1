name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fast, cheap gates that turn every push/PR green-or-red in minutes,
# BEFORE the heavyweight publish matrix ever runs. This is the
# "installs-from-git-and-builds-without-friction" guarantee: nothing
# unbuildable reaches main unnoticed.

jobs:
  frontend-gates:
    name: Frontend gates (doctor, typecheck, build, tests, benchmarks)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: refuse bun.lock (tauri-action lockfile detect)
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            echo "::error::bun.lock present — publish will pick bun over npm."
            exit 1
          fi

      - name: install frontend dependencies (frozen lockfile = one truth)
        run: npm ci

      - name: environment doctor (launch/build diagnosis)
        run: npm run doctor

      - name: release preflight (schema + conflict markers)
        run: npm run release:prepare

      - name: typecheck
        run: npm run lint

      - name: production build
        run: npm run build

      - name: React/unit tests
        run: npm run test:unit

      - name: regression suite (61+ checks)
        run: node scripts/test-all.js

      - name: adaptive engine + research layer + bench desk
        run: npm run test:adaptive && npm run test:research && npm run test:bench

      - name: rescue lab + NCK + core lib gates
        run: npm run test:lab && npm run test:nck && npm run test:rescue && npm run test:core

      - name: brand + protocol matrix gates
        run: npm run test:brands && npm run test:matrix

      - name: test-generated benchmarks (documents stay honest)
        run: npm run benchmark:frp && npm run benchmark:sheet

      - name: production audit
        run: npm run audit:prod

  rust-compile-check:
    name: Rust compile check (${{ matrix.os }}) — the historical blind spot
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: install system libs (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libusb-1.0-0-dev

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: frontend deps (cargo generate_context needs dist/, so build it)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: build frontend (dist/ feeds tauri generate_context!)
        run: npm ci && npm run build

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: cargo check src-tauri
        working-directory: src-tauri
        run: cargo check --locked
